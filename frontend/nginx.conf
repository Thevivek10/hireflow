server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;   # backend accepts CV uploads up to 5 MB

  # The pages build URLs as "${API_BASE}/api/..." where API_BASE is "/api" in
  # a non-production build, which yields /api/api/...  Collapse it.
  location ^~ /api/api/ {
    rewrite ^/api/api/(.*)$ /api/$1 break;
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /uploads/ {
    proxy_pass http://backend:5000;
  }

  # Single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri /index.html;
  }
}
